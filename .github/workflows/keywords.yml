# 네이버 검색광고 키워드 도구로 월간 검색량을 조회해서 topics/keywords.json 에 저장해요.
# 일·화·목 저녁 7시(한국 시간)에 자동 실행 → 8시 글 준비 때 Claude가 이 숫자를 보고 제목·키워드를 골라요.
# 손으로 돌릴 때: Actions → 키워드 조사 → Run workflow → 키워드 칸에 쉼표로 (비우면 seed_keywords.txt 전체)
name: 키워드 조사
on:
  schedule:
    - cron: "0 10 * * 0,2,4"   # UTC 10시 = 한국 19시
  workflow_dispatch:
    inputs:
      keywords:
        description: "조회할 키워드 (쉼표로 구분, 비우면 topics/seed_keywords.txt 전체)"
        required: false
permissions:
  contents: write
concurrency: publish
jobs:
  keywords:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: 키 확인
        id: key
        env:
          K: ${{ secrets.NAVER_AD_API_KEY }}
        run: echo "ok=$([ -n "$K" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: 검색량 조회
        if: steps.key.outputs.ok == 'yes'
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          INPUT: ${{ github.event.inputs.keywords }}
        run: |
          if [ -n "$INPUT" ]; then
            IFS=',' read -ra KW <<< "$INPUT"; python3 tools/keywords.py "${KW[@]}"
          else
            python3 tools/keywords.py
          fi
      - name: 키가 없을 때
        if: steps.key.outputs.ok != 'yes'
        run: echo "NAVER_AD_API_KEY 가 없어서 건너뜀 (README '검색량 조회' 설정 참고)"
      - name: 결과 저장
        if: steps.key.outputs.ok == 'yes'
        run: |
          git config user.name "woodenjoy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics/keywords.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "키워드 검색량 $(TZ=Asia/Seoul date '+%m/%d')"
          git pull --rebase && git push
