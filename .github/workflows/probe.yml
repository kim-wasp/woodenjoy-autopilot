name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ -z "$T" ]; then echo "THREADS_TOKEN_SISIBIBI 없음"; exit 0; fi
          echo "길이 ${#T}, 앞 4자 ${T:0:4}"
          curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$T"; echo
          curl -s "https://graph.threads.net/v1.0/me/threads_publishing_limit?fields=quota_usage,config&access_token=$T" | head -c 300; echo
        env: { T: "${{ secrets.THREADS_TOKEN_SISIBIBI }}" }
