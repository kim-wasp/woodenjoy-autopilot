name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python3 tools/wp_touch.py 717
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
      - run: |
          set +e; sleep 5
          echo "home $(curl -s https://forsmartlife.com/ | grep -c wn-site-style)"; curl -s https://forsmartlife.com/ | grep -o 'Cached page generated[^>]*' | head -1
