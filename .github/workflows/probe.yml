name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
        run: |
          python3 - <<'PY'
          import requests, re, base64, os, time
          A={"Authorization":"Basic "+base64.b64encode(f"gracelyun28:{os.environ['WP']}".encode()).decode(),"User-Agent":"Mozilla/5.0"}
          B="https://forsmartlife.com"; U={"User-Agent":"Mozilla/5.0"}
          def sm_urls():
              return re.findall(r"<loc>([^<]+)</loc>", requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text)
          def private_in_sitemap(urls):
              bad=[]
              for u in urls:
                  if requests.head(u,headers=U,timeout=20,allow_redirects=False).status_code!=200: bad.append(u)
              return bad
          urls=sm_urls(); bad=private_in_sitemap(urls); print("전:", len(urls), "문제", len(bad))
          for u in bad[:40]: print("  ", u)
          for st in ["off","on"]:
              r=requests.post(f"{B}/wp-json/rankmath/v1/saveModule",headers=A,json={"module":"sitemap","state":st},timeout=60); print("module", st, r.status_code, r.text[:150]); time.sleep(4)
          t=requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text
          print("새 글 포함:", "norovirus" in t, "비공개 포함:", "olive-oil" in t, "주소 수:", len(re.findall("<loc>",t)))
          urls=sm_urls(); bad=private_in_sitemap(urls); print("모듈 재시작 후:", len(urls), "문제", len(bad))
          PY
