name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
        run: |
          python3 - <<'PY'
          import requests, re, base64, os, time
          A={"Authorization":"Basic "+base64.b64encode(f"gracelyun28:{os.environ['WP']}".encode()).decode(),"User-Agent":"Mozilla/5.0"}
          B="https://forsmartlife.com"; U={"User-Agent":"Mozilla/5.0"}
          def sm_urls():
              return re.findall(r"<loc>([^<]+)</loc>", requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text)
          def private_in_sitemap(urls):
              bad=[]
              for u in urls:
                  if requests.head(u,headers=U,timeout=20,allow_redirects=False).status_code!=200: bad.append(u)
              return bad
          urls=sm_urls(); bad=private_in_sitemap(urls); print("전:", len(urls), "문제", len(bad))
          for u in bad[:40]: print("  ", u)
          for q in ["", "?x=1"]:
              r=requests.get(f"{B}/post-sitemap.xml{q}",headers=U,timeout=30)
              print("sm", q, r.status_code, len(re.findall("<loc>",r.text)), "olive" in r.text, r.headers.get("last-modified"), r.text[-200:].replace("\n"," "))
          r=requests.get(f"{B}/wp-json/wp-super-cache/v1/settings",headers=A,timeout=30); print("wpsc settings", r.status_code, r.text[:300])
          r=requests.post(f"{B}/wp-json/wp-super-cache/v1/cache",headers=A,json={"wp_delete_cache":True},timeout=60); print("wpsc delete", r.status_code, r.text[:200])
          time.sleep(3)
          urls=sm_urls(); bad=private_in_sitemap(urls); print("캐시삭제 후:", len(urls), "문제", len(bad))
          PY
