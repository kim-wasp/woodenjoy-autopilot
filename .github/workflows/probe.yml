name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://forsmartlife.com/ https://forsmartlife.com/category/season-health-tips/ https://forsmartlife.com/about/; do
            echo "$u $(curl -s "$u" | grep -c wn-site-style) $(curl -sI "$u" | grep -i 'cache\|age:' | tr '\r\n' '  ')"; done
          curl -s https://forsmartlife.com/ | grep -o 'Cached page generated[^>]*' | head -2
