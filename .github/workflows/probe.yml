name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="https://api.uplika.com"
          g(){ c=$(curl -s -o b.txt -w "%{http_code}" -H "authorization: Bearer $K" "$A$1"); echo "GET $c $1 $(cat b.txt)"; }
          p(){ c=$(curl -s -o b.txt -w "%{http_code}" -X POST -H "authorization: Bearer $K" -H "content-type: application/json" -d "$2" "$A$1"); echo "POST $c $1 $(cat b.txt)"; }
          true
          p /v1/naver/visibility/checks '{"keywords":["싱크대 경첩"],"blog":"cafe_peanut"}'
        env: { K: "${{ secrets.UPLIKA_API_KEY }}" }
