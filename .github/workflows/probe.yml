name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p out && cd engine && python3 -c "
          import imagegen, json, shutil
          s=json.load(open('../sites/woodenjoy/site.json'))['images']
          p='A Korean apartment interior door whose hinge screw is loose, the door sagging and scraping the laminate floor. Composition: extreme detail of the problem area, slightly out-of-focus background. '+s['photo_style']
          imagegen.generate(p,'../out/woodenjoy_after.jpg',{'provider':'gemini','realism':True},size=(1200,800))
          s2=json.load(open('../sites/infobay/site.json'))['images']
          imagegen.generate('Guests lining up at the reception desk of a Korean wedding hall handing over envelopes. '+s2['photo_style'],'../out/infobay_after.jpg',{'provider':'gemini','realism':True},size=(1200,800))
          "
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
      - uses: actions/upload-artifact@v4
        with: { name: samples, path: out }
