name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=$(printf '%s' "gracelyun28:$WP" | base64 -w0)
          L=$(curl -sS "https://forsmartlife.com/wp-json/wp/v2/posts/983?_fields=link" | python3 -c "import json,sys;print(json.load(sys.stdin)['link'])")
          echo "LINK $L"
          echo "PAGE $(curl -sS "$L?nc=$RANDOM" | grep -oE '<meta name="robots" content="[^"]+"')"
          echo "HDR $(curl -sSI "$L" | grep -iE 'cache|age|x-' | tr '\n' ' ')"
          echo "META $(curl -sS -H "Authorization: Basic $A" "https://forsmartlife.com/wp-json/wp/v2/posts/983?context=edit&_fields=meta" | head -c 400)"
          echo "UPD $(curl -sS -X POST -H "Authorization: Basic $A" -H 'Content-Type: application/json' -d '{"objectType":"post","objectID":983,"meta":{"rank_math_robots":["noindex","follow"]}}' https://forsmartlife.com/wp-json/rankmath/v1/updateMeta | head -c 300)"
          echo "ROUTES $(curl -sS https://forsmartlife.com/wp-json/rankmath/v1 | python3 -c "import json,sys;print(list(json.load(sys.stdin).get('routes',{}).keys())[:20])")"
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
