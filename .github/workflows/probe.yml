name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python3 tools/site_shots.py
      - run: python3 tools/wp_rewrite_claims.py --ids 663,608,947,937,679,1019
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 화면 확인, 단정 문장 미리보기" && git pull -q --rebase && git push -q || true
