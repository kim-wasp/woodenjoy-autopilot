name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "research key set: ${R:+yes} len ${#R}; api key len ${#K}; same: $([ "$R" = "$K" ] && echo yes || echo no)"
          curl -s -H "authorization: Bearer $R" https://api.uplika.com/v1/accounts | head -c 300; echo
        env: { R: "${{ secrets.UPLIKA_RESEARCH_KEY }}", K: "${{ secrets.UPLIKA_API_KEY }}" }
