name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
        run: |
          python3 - <<'PY'
          import requests, re, base64, os, time
          A={"Authorization":"Basic "+base64.b64encode(f"gracelyun28:{os.environ['WP']}".encode()).decode(),"User-Agent":"Mozilla/5.0"}
          B="https://forsmartlife.com"; U={"User-Agent":"Mozilla/5.0"}
          def sm_urls():
              return re.findall(r"<loc>([^<]+)</loc>", requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text)
          def private_in_sitemap(urls):
              bad=[]
              for u in urls:
                  if requests.head(u,headers=U,timeout=20,allow_redirects=False).status_code!=200: bad.append(u)
              return bad
          urls=sm_urls(); bad=private_in_sitemap(urls); print("전:", len(urls), "문제", len(bad))
          for u in bad[:40]: print("  ", u)
          for act in ["clear_transients","flush_sitemap_cache","delete_sitemap_cache"]:
              r=requests.post(f"{B}/wp-json/rankmath/v1/toolsAction",headers=A,json={"action":act},timeout=60)
              print("tool", act, r.status_code, r.text[:150])
          time.sleep(3)
          urls=sm_urls(); bad=private_in_sitemap(urls); print("도구 후:", len(urls), "문제", len(bad))
          if bad:
              ids=[]
              for u in bad:
                  slug=u.rstrip("/").split("/")[-1]
                  r=requests.get(f"{B}/wp-json/wp/v2/posts",headers=A,params={"slug":slug,"status":"private","context":"edit","_fields":"id"},timeout=30).json()
                  if r: ids.append(r[0]["id"])
              for i in ids:
                  r=requests.post(f"{B}/wp-json/rankmath/v1/updateMeta",headers=A,json={"objectType":"post","objectID":i,"meta":{"rank_math_robots":["noindex","nofollow"]}},timeout=60)
              print("noindex 설정", len(ids), r.status_code)
              time.sleep(3)
              urls=sm_urls(); bad=private_in_sitemap(urls); print("noindex 후:", len(urls), "문제", len(bad))
          PY
