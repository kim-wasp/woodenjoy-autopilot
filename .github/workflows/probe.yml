name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://forsmartlife.com/ads.txt http://forsmartlife.com/ads.txt https://www.forsmartlife.com/ads.txt http://www.forsmartlife.com/ads.txt; do
            echo "== $u"; curl -s -o b.txt -w "%{http_code} %{content_type} %{url_effective} redirects=%{num_redirects}\n" -L -A "Mediapartners-Google" "$u"; head -c 200 b.txt; echo; done
          echo "== pub ids on home"; curl -s https://forsmartlife.com/ | grep -o 'ca-pub-[0-9]*' | sort | uniq -c
          echo "== robots"; curl -s https://forsmartlife.com/robots.txt
          dig +short forsmartlife.com; dig +short www.forsmartlife.com
