name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=$(printf '%s' "gracelyun28:$WP" | base64 -w0)
          echo "ME $(curl -sS -o /tmp/me -w '%{http_code}' -H "Authorization: Basic $A" 'https://forsmartlife.com/wp-json/wp/v2/users/me?context=edit') $(head -c 200 /tmp/me | sed 's/"email":"[^"]*"/"email":"(숨김)"/' | grep -oE '"(name|slug|roles)":[^,]*' | tr '\n' ' ')"
          echo "DRAFTS $(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Basic $A" 'https://forsmartlife.com/wp-json/wp/v2/posts?status=draft&per_page=1')"
          echo "RANKMATH $(curl -sS -o /dev/null -w '%{http_code}' 'https://forsmartlife.com/wp-json/rankmath/v1')"
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
