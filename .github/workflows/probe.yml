name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://forsmartlife.com/flu-vaccine-november-2026-free-eligibility-timing/?nocache=$RANDOM" > p.html
          grep -c "wn-site-style" p.html; grep -o 'id="block-38"[^<]*<[^>]*>.\{0,300\}' p.html | head -3
          grep -o '<div class="footer-bar">.\{0,600\}' p.html | head -2
          curl -s -u "gracelyun28:$WP" "https://forsmartlife.com/wp-json/wp/v2/widgets/block-38?context=edit" | head -c 600
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
