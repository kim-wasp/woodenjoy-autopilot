name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python3 tools/wp_site_css.py forsmartlife
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", HERO_FIX: "1447" }
      - run: sleep 20 && python3 tools/site_shots.py
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 디자인 적용 화면" && git pull -q --rebase && git push -q || true
