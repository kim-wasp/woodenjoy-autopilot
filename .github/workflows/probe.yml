name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.sisibibinote.kr/ http://www.sisibibinote.kr/ "https://www.sisibibinote.kr/posts/?a=1" http://sisibibinote.kr/ https://sisibibinote.kr/; do echo "== $u"; curl -sI --max-time 20 -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "$u" | grep -iE "^HTTP|^location" || echo "연결 안 됨"; done
          curl -s https://sisibibinote.kr/ | grep -io '<link rel="canonical"[^>]*>' || true
          dig +short www.myinfobay.com; dig +short www.sisibibinote.kr
