name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r requirements.txt
      - run: |
          cd engine && python3 -c "
          import commonsense, json, requests
          v=commonsense.vote_stats('infobay'); print('투표결과', len(v)); print('\n'.join(v[:8]))
          db=commonsense.DB(commonsense.load_site('infobay')['app']); c=db.get('cards',{'select':'id','order':'id.desc','limit':1})[0]
          print('샘플 rpc', requests.post(db.url+'/rpc/card_results',headers=db.h,json={'p_card_id':c['id']}).text[:600])
          "
          for h in sisibibinote.kr myinfobay.com; do echo "$h ads.txt: $(curl -s https://$h/ads.txt | head -c 80)"; echo "$h adsense code: $(curl -s https://$h/ | grep -c pagead2)"; done
          echo "election noindex: $(curl -s https://sisibibinote.kr/category/election/ | grep -c noindex)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
