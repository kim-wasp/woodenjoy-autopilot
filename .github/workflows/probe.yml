name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - run: python3 tools/wp_prune.py
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", IDS: "1006,1003,992,947,937,880,770,688,634,608,597,592,484,479,416,387,289,138,136,132,115,103,99,91,89,87,83,76,66,64,53,49,45,35,9" }
      - run: python3 tools/wp_improve.py
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", IDS: "1038,1028" }
      - run: python3 tools/wp_touch.py 717
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 약한 글 35개 비공개, 2개 보강" && git pull -q --rebase && git push -q || true
