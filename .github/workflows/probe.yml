name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests beautifulsoup4
      - run: python3 tools/site_audit.py sisibibinote.kr myinfobay.com forsmartlife.com
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit/site_audit.json && git commit -qm "사이트 전체 점검" && git pull -q --rebase && git push -q || true
