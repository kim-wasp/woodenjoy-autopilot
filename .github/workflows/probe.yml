# 점검용: tools/probe.sh 를 바꿔 올리면 실행돼요 (이 워크플로 파일은 고치지 않아요 → 글 만들기와 충돌 없음)
name: probe
on: { workflow_dispatch: {}, push: { branches: [main], paths: ["tools/probe.sh"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r requirements.txt beautifulsoup4
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: bash tools/probe.sh
        continue-on-error: true  # 점검용이라 실패해도 실패 메일을 보내지 않아요 (결과는 기록에서 봐요)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_FORSMARTLIFE_PASS: ${{ secrets.WP_FORSMARTLIFE_PASS }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_TOKEN_INFOBAY: ${{ secrets.THREADS_TOKEN_INFOBAY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_INFOBAY: ${{ secrets.IG_TOKEN_INFOBAY }}
          THREADS_TOKEN_SISIBIBI: ${{ secrets.THREADS_TOKEN_SISIBIBI }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WP: ${{ secrets.WP_FORSMARTLIFE_PASS }}
          GH_TOKEN: ${{ github.token }}
