name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}" }
        run: |
          python3 - <<'PY'
          import requests, re, base64, os, time
          A={"Authorization":"Basic "+base64.b64encode(f"gracelyun28:{os.environ['WP']}".encode()).decode(),"User-Agent":"Mozilla/5.0"}
          B="https://forsmartlife.com"; U={"User-Agent":"Mozilla/5.0"}
          def sm_urls():
              return re.findall(r"<loc>([^<]+)</loc>", requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text)
          def private_in_sitemap(urls):
              bad=[]
              for u in urls:
                  if requests.head(u,headers=U,timeout=20,allow_redirects=False).status_code!=200: bad.append(u)
              return bad
          urls=sm_urls(); bad=private_in_sitemap(urls); print("전:", len(urls), "문제", len(bad))
          for u in bad[:40]: print("  ", u)
          t=requests.get(f"{B}/post-sitemap.xml",headers=U,timeout=30).text
          for m in re.finditer(r"<url>(.*?)</url>", t, re.S):
              if "olive-oil" in m.group(1) or "iron" in m.group(1): print("entry:", re.sub(r"\s+"," ",m.group(1))[:300])
          r=requests.get(f"{B}/wp-json/wp/v2/posts/1520",headers=A,params={"context":"edit","_fields":"id,slug,modified"},timeout=30).json(); print("1520", r)
          print("1520 in sitemap:", r["slug"] in t, re.search(r[ "slug"]+r"/</loc>\s*<lastmod>([^<]+)", t).group(1) if r["slug"] in t else "")
          r=requests.get(f"{B}/wp-json/wp/v2/posts/880",headers=A,params={"context":"edit","_fields":"id,status,modified,date"},timeout=30).json(); print("880", r)
          r=requests.get(f"{B}/wp-json/rankmath/v1/getHead",headers=A,params={"url":f"{B}/olive-oil-health-benefits/"},timeout=30); print("head", r.status_code, r.text[:200])
          PY
