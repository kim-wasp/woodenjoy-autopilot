name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          curl -s https://woodenjoy-autopilot-studio.vercel.app/app.js | grep -c "viewTrends" || true
          curl -s -o /dev/null -w "%{http_code}\n" https://woodenjoy-autopilot-studio.vercel.app/api/trends
