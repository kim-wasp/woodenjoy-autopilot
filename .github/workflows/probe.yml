name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          curl -s -o status/audit/fsl/favicon.jpg https://forsmartlife.com/wp-content/uploads/2026/03/forsmartlife_favicon-300x300.jpg
          python3 tools/fsl_shot.py
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 글 화면" && git pull -q --rebase && git push -q || true
