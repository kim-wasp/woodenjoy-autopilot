name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://api.uplika.com/mcp
          H='-H content-type:application/json -H accept:application/json,text/event-stream'
          echo "== init"; curl -s -D h.txt $H -H "authorization: Bearer $K" -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"studio","version":"1"}}}' $U | head -c 300; echo; grep -i "mcp-session\|www-auth" h.txt
          S=$(grep -i mcp-session-id h.txt | awk '{print $2}' | tr -d '\r')
          echo "== call with session"; curl -s $H -H "authorization: Bearer $K" ${S:+-H "mcp-session-id: $S"} -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_naver_keyword_history","arguments":{"keyword":"싱크대경첩","limit":1}}}' $U | head -c 300; echo
          echo "== x-api-key"; curl -s $H -H "x-api-key: $K" -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_naver_keyword_history","arguments":{"keyword":"싱크대경첩","limit":1}}}' $U | head -c 300; echo
          echo "== query"; curl -s $H -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_naver_keyword_history","arguments":{"keyword":"싱크대경첩","limit":1}}}' "$U?api_key=$K" | head -c 300; echo
          curl -s https://api.uplika.com/.well-known/oauth-protected-resource | head -c 400; echo
        env: { K: "${{ secrets.UPLIKA_API_KEY }}" }
