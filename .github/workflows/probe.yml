name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - run: python3 tools/wp_rewrite_claims.py --all --apply
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 단정 문장 고치기 전체 반영" && git pull -q --rebase && git push -q || true
