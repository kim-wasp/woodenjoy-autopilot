name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in /v1/naver/visibility/blog/cafe_peanut "/v1/naver/report?blog=cafe_peanut" "/v1/naver/report-card?blog=cafe_peanut" "/v1/naver/blog/cafe_peanut/visibility" "/v1/naver/visibility/cafe_peanut"; do
            c=$(curl -s -o b.txt -w "%{http_code}" -H "authorization: Bearer $K" "https://api.uplika.com$p"); echo "$c $p $(head -c 150 b.txt)"; done
          for u in https://api.uplika.com/mcp https://uplika.com/mcp https://mcp.uplika.com/mcp https://api.uplika.com/v1/mcp; do
            c=$(curl -s -o b.txt -w "%{http_code}" -X POST -H "authorization: Bearer $K" -H "content-type: application/json" -H "accept: application/json, text/event-stream" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' "$u"); echo "$c $u $(head -c 300 b.txt | tr '\n' ' ')"; done
        env: { K: "${{ secrets.UPLIKA_API_KEY }}" }
