name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - run: python3 tools/wp_rewrite_claims.py --ids 634,646,627,621,608,614,602,597,592,586,504,509,499,494,489,484,479,474,469,439,434,421,416,392,387,382,370,365,360,354,289,283,277,269,138,136,134,132,130,127,125,122,119,117,115,110,112,108,106,103,101,99,97,95,93,91,89,87,85,83,81,78,76,74,72,68,66,64,59,57,55,53,49,47,45,43,41,39,37,35,33,31,29,27,9 --apply
        env: { WP: "${{ secrets.WP_FORSMARTLIFE_PASS }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
      - run: |
          git config user.name studio-bot; git config user.email bot@users.noreply.github.com
          git add status/audit && git commit -qm "forsmartlife 단정 문장 고치기 남은 글 반영" && git pull -q --rebase && git push -q || true
