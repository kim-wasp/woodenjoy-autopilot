name: probe
on: { push: { branches: [main], paths: [".github/workflows/probe.yml"] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in v1 v1/openapi.json openapi.json v1/docs docs/api; do echo "== $u"; curl -s "https://api.uplika.com/$u" -H "authorization: Bearer $K" | tr ',' '\n' | grep -i "naver\|keyword\|error" | head -40; done
        env: { K: "${{ secrets.UPLIKA_RESEARCH_KEY }}", NCID: "${{ secrets.NAVER_CLIENT_ID }}", NCS: "${{ secrets.NAVER_CLIENT_SECRET }}" }
