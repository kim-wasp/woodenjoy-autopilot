# 커먼센스 앱 숫자 확인: 투표 수, 참여자 수, 카드별 표 수 (개인 정보 없이 숫자만)
name: 앱 통계
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: 세기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install requests -q
          python3 - <<'PY' | tee topics/app_stats.txt
          import sys, collections, datetime
          sys.path.insert(0, "engine")
          import commonsense
          db = commonsense.DB({})
          def get(t, sel):
              out = []
              while True:
                  rows = db.get(t, {"select": sel, "limit": 1000, "offset": len(out)}); out += rows
                  if len(rows) < 1000: return out
          resp = get("responses", "*")
          prof = get("profiles", "*")
          by = {p["id"]: p for p in prof}
          ages = collections.Counter((2026 - int(p["birth_year"])) // 10 * 10 for p in prof if p.get("birth_year"))
          per = collections.Counter(r["card_id"] for r in resp)
          tcol = next((k for k in (resp[0] if resp else {}) if "at" in k and "creat" in k), None)
          days = collections.Counter(str(r.get(tcol, ""))[:10] for r in resp) if tcol else {}
          print("확인:", datetime.datetime.utcnow().isoformat()[:16], "UTC")
          print("총 투표 수:", len(resp)); print("투표한 사람 수:", len({r["user_id"] for r in resp}))
          print("프로필(나이) 입력한 사람:", len(prof), "/ 나이대:", dict(sorted(ages.items())))
          print("투표 받은 카드 수:", len(per), "/ 표 많은 카드:", per.most_common(5))
          print("카드당 표 수 분포(10표 이상 카드 수):", sum(1 for v in per.values() if v >= 10), "/ 30표 이상:", sum(1 for v in per.values() if v >= 30))
          print("최근 14일 날짜별 투표:", sorted(days.items())[-14:] if days else "날짜 칸 없음")
          PY
      - name: 저장
        run: |
          git config user.name "woodenjoy-bot"; git config user.email "bot@users.noreply.github.com"
          git add topics/app_stats.txt && git commit -qm "앱 통계" && git push || true
