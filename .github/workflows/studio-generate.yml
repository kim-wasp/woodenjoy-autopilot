# [스튜디오] 글 만들기: 관리화면의 '만들기' 버튼, 또는 사이트별 '글 만들기' 시간에 자동 실행
# 결과는 승인 요청(PR)으로 올라와요. 관리화면 '승인 대기'에서 확인하고 승인하면 정해진 시간에 올라가요.
name: 스튜디오 글 만들기
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      site: { description: "사이트 id (예: infobay)", required: false }
      topic: { description: "주제나 제목 (비우면 자동 선택)", required: false }
      notes: { description: "고칠 점 (다시 만들기)", required: false }
      redo_branch: { description: "다시 만들 승인 요청의 브랜치 (비우면 새 글)", required: false }
      view: { description: "편집자 견해 (정치 블로그: 사장님 의견을 바탕으로 글 쓰기)", required: false }
      mode: { description: "post / ideas / threads / thumb / opinion / polls", required: false, default: "post" }
      photos: { description: "사진으로 글쓰기: 관리화면에서 올린 사진 폴더 (uploads/...)", required: false }
permissions:
  contents: write
  pull-requests: write
concurrency: studio-generate
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 만들 사이트 정하기
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.site }}" ]; then
            echo "sites=${{ github.event.inputs.site }}" >> "$GITHUB_OUTPUT"
          else
            echo "sites=$(python3 engine/scheduler.py generate | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          # Claude API 키가 아직 없으면 조용히 건너뛰어요 (실패 메일이 가지 않게)
          if [ -z "$HAS_KEY" ]; then echo "ANTHROPIC_API_KEY 가 아직 없어서 건너뜀"; echo "sites=" >> "$GITHUB_OUTPUT"; fi
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && 'yes' || '' }}
      - uses: ./.github/actions/setup
        if: steps.pick.outputs.sites != ''
      - name: 만들기
        if: steps.pick.outputs.sites != ''
        env:
          # 새 사이트 비밀키를 추가하면 여기에도 한 줄 추가해요
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPLIKA_API_KEY: ${{ secrets.UPLIKA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN_INFOBAY: ${{ secrets.IG_TOKEN_INFOBAY }}
          THREADS_TOKEN_INFOBAY: ${{ secrets.THREADS_TOKEN_INFOBAY }}
          IG_TOKEN_FORSMARTLIFE: ${{ secrets.IG_TOKEN_FORSMARTLIFE }}
          THREADS_TOKEN_FORSMARTLIFE: ${{ secrets.THREADS_TOKEN_FORSMARTLIFE }}
          WP_FORSMARTLIFE_PASS: ${{ secrets.WP_FORSMARTLIFE_PASS }}
          IG_TOKEN_ITINFOBAY: ${{ secrets.IG_TOKEN_ITINFOBAY }}
          THREADS_TOKEN_ITINFOBAY: ${{ secrets.THREADS_TOKEN_ITINFOBAY }}
          WP_ITINFOBAY_PASS: ${{ secrets.WP_ITINFOBAY_PASS }}
          IG_TOKEN_MYINFOBAY: ${{ secrets.IG_TOKEN_MYINFOBAY }}
          THREADS_TOKEN_MYINFOBAY: ${{ secrets.THREADS_TOKEN_MYINFOBAY }}
          THREADS_TOKEN_SISIBIBI: ${{ secrets.THREADS_TOKEN_SISIBIBI }}
          WP_MYINFOBAY_PASS: ${{ secrets.WP_MYINFOBAY_PASS }}
          SISIBIBI_TOKEN: ${{ secrets.SISIBIBI_TOKEN }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ github.event.inputs.topic }}
          NOTES: ${{ github.event.inputs.notes }}
          REDO: ${{ github.event.inputs.redo_branch }}
          MODE: ${{ github.event.inputs.mode }}
          VIEW: ${{ github.event.inputs.view }}
          PHOTOS: ${{ github.event.inputs.photos }}
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          # 실행 기록을 studio-logs 가지에 남겨요 (실패 원인 확인용)
          save_log() {
            cp gen.log /tmp/gen.log 2>/dev/null || echo "기록 없음" > /tmp/gen.log
            # 작업 폴더는 건드리지 않고 따로 꺼낸 폴더에서 기록을 올려요 (고친 파일이 있어도 실패하지 않게)
            (
              set +e
              rm -rf /tmp/logwt; git worktree prune
              if git fetch -q origin studio-logs 2>/dev/null; then git worktree add -q -f /tmp/logwt FETCH_HEAD; else git worktree add -q -f --detach /tmp/logwt && (cd /tmp/logwt && git checkout -q --orphan tmp-logs && git rm -rqf .); fi
              cd /tmp/logwt && mkdir -p logs && cp /tmp/gen.log "logs/$1-$(TZ=Asia/Seoul date +%Y%m%d-%H%M).log" \
                && git add logs && git commit -qm "실행 기록: $1" && git push -q origin HEAD:studio-logs
              cd - >/dev/null; git worktree remove -f /tmp/logwt
            ) || true
          }
          for site in ${{ steps.pick.outputs.sites }}; do
            if [ "$MODE" = "threads" ]; then
              # 이미 승인된 글의 스레드 문구만 다시 쓰기 (TOPIC = 글 폴더들, 띄어쓰기로 구분)
              for dir in $TOPIC; do python3 engine/generate.py "$site" --threads "$dir" 2>&1 | tee -a gen.log; done
              files=$(for dir in $TOPIC; do echo "$dir/post.json"; done); mkdir -p /tmp/keep
              for f in $files; do mkdir -p "/tmp/keep/$(dirname "$f")"; cp "$f" "/tmp/keep/$f"; done
              for i in 1 2 3; do
                git fetch -q origin main && git reset -q --hard origin/main
                for f in $files; do cp "/tmp/keep/$f" "$f"; done
                git add $files && git commit -qm "스레드 문구 다시 쓰기: $site" && git push -q origin HEAD:main && break
                sleep 5
              done
              save_log "$site-threads"   # 저장한 다음에 기록 (고친 파일이 남아 있으면 기록 가지로 못 넘어가요)
              continue
            fi
            if [ "$MODE" = "thumb" ] && [ -z "$REDO" ]; then
              # 이미 만든 글의 대표사진+홈피드 썸네일만 다시 만들기 (TOPIC = 글 폴더, NOTES = 썸네일 문구)
              dir="$TOPIC"
              python3 engine/generate.py "$site" --thumb "$dir" --notes "$NOTES" 2>&1 | tee -a gen.log
              rm -rf /tmp/keepd && cp -r "$dir" /tmp/keepd
              for i in 1 2 3; do
                git fetch -q origin main && git reset -q --hard origin/main
                rm -rf "$dir" && cp -r /tmp/keepd "$dir"
                git add "$dir" && git commit -qm "대표사진 다시 만들기: $dir" && git push -q origin HEAD:main && break
                sleep 5
              done
              save_log "$site-thumb"
              continue
            fi
            if [ "$MODE" = "polls" ]; then
              # 스레드 투표 대기열 만들기 (올리지 않음, 미리보기용)
              python3 engine/threads_poll.py make 7 2>&1 | tee gen.log
              for i in 1 2 3; do
                cp status/threads_polls.json /tmp/tp.json
                git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/tp.json status/threads_polls.json
                git add status/threads_polls.json && git commit -qm "스레드 투표 대기열" && git push -q origin HEAD:main && break
                sleep 5
              done
              save_log "$site-polls"
              continue
            fi
            if [ "$MODE" = "ideas" ]; then
              python3 engine/generate.py "$site" --ideas --topic "$TOPIC"
              git add sites && git commit -qm "글감 추천: $site" && git pull -q --rebase && git push -q || true
              continue
            fi
            if [ -n "$REDO" ]; then
              git checkout -q "$REDO"
              # 프로그램은 main 최신으로 (가지에는 글 폴더만 저장)
              git restore --source origin/main --worktree -- engine tools sites studio .github 2>/dev/null || true
              dir=$(git diff --name-only origin/main...HEAD -- content | head -1 | cut -d/ -f1-3)
              if [ "$MODE" = "thumb" ]; then
                # 승인 대기 글의 대표사진만 다시 만들기
                set +e; python3 engine/generate.py "$site" --thumb "$dir" --notes "$NOTES" 2>&1 | tee gen.log; set -e
                git add content && git commit -qm "대표사진: $(jq -r .title $dir/post.json)" && git push -q origin "$REDO" || echo "::error::대표사진 저장 실패"
                save_log "$site-thumb"
                git checkout -q -f main
                continue
              fi
              if [ "$MODE" = "opinion" ]; then
                # 편집자 생각만 붙이기 (글 전체를 다시 쓰지 않아요)
                set +e; python3 engine/generate.py "$site" --opinion "$dir" --notes "$NOTES" 2>&1 | tee gen.log; set -e
                git add content && git commit -qm "편집자 생각: $(jq -r .title $dir/post.json)" && git push -q origin "$REDO" || echo "::error::편집자 생각 저장 실패"
                save_log "$site-opinion"
                gh pr comment "$REDO" --body "✍️ 편집자 생각을 넣었어요." || true
                git checkout -q -f main
                continue
              fi
              set +e; python3 engine/generate.py "$site" --topic "$TOPIC" --notes "$NOTES" --view "$VIEW" --out "$dir" 2>&1 | tee gen.log; ok=${PIPESTATUS[0]}; set -e
              git add content && git commit -qm "다시 만들기: $(jq -r .title $dir/post.json)" && git push -q origin "$REDO" || echo "::error::다시 만들기 저장 실패"
              save_log "$site-redo"
              # 승인 대기 목록에 바뀐 제목·점검 결과가 보이게
              gh pr edit "$REDO" --title "$([ $ok = 0 ] && echo '[승인 대기]' || echo '[점검 실패]') [$site] $(jq -r .title $dir/post.json)" || true
              gh pr comment "$REDO" --body "🔁 다시 만들었어요 ($( [ $ok = 0 ] && echo '점검 통과' || echo '점검 실패')). 고칠 점: ${NOTES:-없음}"
              git checkout -q -f main
              continue
            fi
            set +e; python3 engine/generate.py "$site" --topic "$TOPIC" --notes "$NOTES" --view "$VIEW" ${PHOTOS:+--photos "$PHOTOS"} 2>&1 | tee gen.log; ok=${PIPESTATUS[0]}; set -e
            save_log "$site"
            dir=$(grep '::set-output-dir::' gen.log | tail -1 | sed 's/::set-output-dir:://')
            [ -n "$dir" ] || { echo "글 폴더가 없어요"; exit 1; }
            title=$(jq -r .title "$dir/post.json")
            branch="studio/$dir"; branch="${branch#studio/content/}"; branch="studio/$branch"
            git checkout -q -b "$branch"
            git add "$dir" && git commit -qm "글 준비: $title" && git push -q -u origin "$branch"
            issues=$(jq -r '.checks.issues[]? | "- " + .' "$dir/post.json")
            prefix=$([ $ok = 0 ] && echo "[승인 대기]" || echo "[점검 실패]")
            gh pr create --base main --head "$branch" --title "$prefix [$site] $title" --label studio --body "관리화면 '승인 대기'에서 미리보기·승인하세요.

          사이트: $site · 폴더: $dir
          ${issues:-점검 통과}" || gh pr create --base main --head "$branch" --title "$prefix [$site] $title" --body "사이트: $site · 폴더: $dir"
            git checkout -q -f main
            # 예약 회차를 만들었다고 기록 (같은 회차를 두 번 만들지 않게)
            cp topics/coupang_links.json /tmp/coupang_links.json 2>/dev/null || true
            for i in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              python3 engine/scheduler.py mark-generated "$site"
              python3 engine/merge_wish.py /tmp/coupang_links.json topics/coupang_links.json
              case "$PHOTOS" in uploads/*) git rm -rq "$PHOTOS" 2>/dev/null || true ;; esac  # 올린 사진은 글 폴더로 옮겼으니 정리
              used=$(grep -o '::used-topic::.*' gen.log | tail -1 | sed "s/::used-topic::$site:://")
              [ -n "$used" ] && python3 engine/generate.py "$site" --mark-used "$used" && git add "sites/$site/ideas.json"
              git add status/generated.json topics/coupang_links.json && git commit -qm "글 만들기 기록: $site" && git push -q origin HEAD:main && break
              sleep 5
            done
          done
