# 속보 트랙: 한국 7시~23시 매시간 뜨는 이슈를 확인 → 스레드 글을 만들어 승인 대기에 올리고 휴대폰(ntfy)으로 알림
# 승인하면 시간표를 기다리지 않고 바로 올라가요. 설정은 sites/<id>/site.json 의 issue_track
# GitHub 예약은 자주 건너뛰어서(하루 1~2번만 도는 날도 있음), 한 번 시작하면 6시간 동안 1시간마다 스스로 다시 확인해요.
# 시작 신호: 아래 예약 3번 + 관리화면 tick(하루 6번, Vercel·Cloudflare 알람). 이미 돌고 있으면 새로 시작하지 않아요.
name: 속보 감지
on:
  schedule:
    - cron: "23 22 * * *"   # 07:23
    - cron: "23 4 * * *"    # 13:23
    - cron: "23 10 * * *"   # 19:23
  workflow_dispatch:
    inputs:
      site: { description: "사이트 id (비우면 전부)", required: false }
permissions:
  contents: write
  id-token: write  # Claude WIF (키 없이 단기 토큰)
  pull-requests: write
concurrency: { group: issue-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: 이슈 찾고 글 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ github.event.inputs.site }}
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            h=$(TZ=Asia/Seoul date +%H); [ "$h" -ge 23 ] && { echo "밤 11시 넘어서 끝"; break; }
            echo "=== $round 번째 확인 $(TZ=Asia/Seoul date +%H:%M)"
            bash tools/issue_round.sh || true
            [ -n "$SITE" ] && break   # 수동 실행(사이트 지정)은 한 번만
            [ $round -lt 6 ] && sleep 3300
          done
      - name: 사용량 기록 저장
        if: always()
        run: bash tools/save_usage.sh
