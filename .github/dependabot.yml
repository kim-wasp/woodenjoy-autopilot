# 의존성 보안 알림·업데이트 (GitHub Dependabot). 보안 업데이트는 저장소 설정에서 켜요.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
